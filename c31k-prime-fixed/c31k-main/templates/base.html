<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}C31K Prime{% endblock %}</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='favicon.jpg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='favicon.jpg') }}" alt="C31K"> <span>C31K Prime</span></a>
  <nav class="nav">
    <a class="nav-link" href="{{ url_for('index') }}">Games</a>
    <a class="nav-link" href="{{ url_for('index', category='tools') }}">Tools</a>
    <a class="nav-link" href="{{ url_for('index', category='vpns') }}">VPN'S</a>
  </nav>
  <div class="account">
    <span class="online"><i></i>{{ active_count }} online</span>
    <a class="profile-mini" href="{{ url_for('profile') }}">Profil</a>
    {% if session.get('username') == 'admin' %}<a class="profile-mini" href="{{ url_for('admin') }}">Admin</a>{% endif %}
    <a class="logout" href="{{ url_for('logout') }}">Çıkış</a>
  </div>
</header>
{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash-wrap">{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}</div>{% endif %}{% endwith %}
{% block content %}{% endblock %}
<script>
async function heartbeat(){
  try { const r = await fetch("{{ url_for('heartbeat') }}", {method:"POST"}); const d = await r.json(); document.querySelectorAll("[data-online]").forEach(x=>x.textContent=d.count+" online"); } catch(e){}
}
setInterval(heartbeat, 20000);
</script>
</body>
</html>
